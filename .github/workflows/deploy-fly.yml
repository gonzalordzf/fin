name: Deploy backend to Fly.io

# Runs on GitHub's runners, which have normal internet access — this exists
# because the Claude Code sandbox that built this app does NOT (its egress
# is allowlisted to package registries + GitHub only, confirmed while
# setting this up), and there's no local terminal available either. This
# workflow is the deploy path.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "fly.toml"
      - ".github/workflows/deploy-fly.yml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-backend-fly
    steps:
      - uses: actions/checkout@v4

      - name: Require all secrets to be set
        # An empty/missing FLY_APP_PASSWORD or FLY_SESSION_SECRET doesn't
        # make "flyctl secrets set" fail below — it just sets the app's
        # APP_PASSWORD to an empty string, which os.environ.get() in
        # main.py treats as falsy, so install_auth() is silently never
        # called. That means a real financial-data backend would go live
        # with NO login wall and no error anywhere. Fail loud here instead.
        run: |
          missing=()
          [ -z "${{ secrets.FLY_API_TOKEN }}" ] && missing+=("FLY_API_TOKEN")
          [ -z "${{ secrets.FLY_APP_PASSWORD }}" ] && missing+=("FLY_APP_PASSWORD")
          [ -z "${{ secrets.FLY_SESSION_SECRET }}" ] && missing+=("FLY_SESSION_SECRET")
          [ -z "${{ secrets.FLY_BBVA_STATEMENT_PASSWORD }}" ] && missing+=("FLY_BBVA_STATEMENT_PASSWORD")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required repo secrets: ${missing[*]} — set them in Settings > Secrets and variables > Actions before this workflow can run. See DEPLOY.md."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure app exists
        run: flyctl apps create "$(grep '^app = ' fly.toml | cut -d'"' -f2)" || true
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Ensure persistent volume exists
        run: |
          APP="$(grep '^app = ' fly.toml | cut -d'"' -f2)"
          if ! flyctl volumes list -a "$APP" --json | jq -e '.[] | select(.Name == "finanzas_data")' > /dev/null; then
            flyctl volumes create finanzas_data --app "$APP" --region qro --size 1 --yes
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Sync app secrets (password gate + BBVA statement password)
        # Without APP_PASSWORD set, main.py never calls install_auth — the
        # deployed backend would serve real financial data with NO login
        # wall. This step is what actually turns the gate on in production;
        # it's not optional. Re-running with the same values is a harmless
        # no-op deploy, not an error.
        run: |
          flyctl secrets set \
            APP_PASSWORD="${{ secrets.FLY_APP_PASSWORD }}" \
            SESSION_SECRET="${{ secrets.FLY_SESSION_SECRET }}" \
            BBVA_STATEMENT_PASSWORD="${{ secrets.FLY_BBVA_STATEMENT_PASSWORD }}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
